<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Расписание Слово Жизни</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
<style>
/* Layout: широкий экран 3224x988, шапка «ПН–ПТ» сверху, две колонки по три карточки, гирлянды листьев сверху и снизу. */
:root{
  --bg:#0b0605; --card:rgba(78,56,46,.62); --card2:rgba(52,36,31,.72);
  --amber:#F2A33A; --rust:#C4501F; --ink:#fff; --edge:rgba(242,163,58,.42);
  --display:'Montserrat','Helvetica Neue',Arial,sans-serif;
  color-scheme:dark;
}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
#stage{position:absolute;left:0;top:0;width:3224px;height:988px;transform-origin:0 0;overflow:hidden;font-family:var(--display);color:var(--ink);
  background:radial-gradient(1500px 700px at 50% 52%,#3a2619 0%,#1d120d 55%,#0b0605 100%)}
#cv{position:absolute;inset:0;pointer-events:none}
.logo{position:absolute;left:2972px;top:118px;width:200px;height:auto}
.card{position:absolute;box-sizing:border-box;border-radius:36px;border:2px solid var(--edge);border-left:9px solid var(--rust);
  background:linear-gradient(100deg,var(--card),var(--card2));box-shadow:0 14px 40px rgba(0,0,0,.45), inset 0 0 60px rgba(242,163,58,.05);
  display:flex;align-items:center;gap:44px;padding:0 40px 0 46px}
.pill{flex:none;min-width:164px;height:98px;padding:0 30px;box-sizing:border-box;border-radius:49px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:58px;letter-spacing:1px;background:linear-gradient(180deg,#E9742B,#B6411A);box-shadow:0 0 34px rgba(233,116,43,.45),inset 0 2px 0 rgba(255,255,255,.2)}
.lines{display:flex;flex-direction:column;gap:12px;min-width:0}
.ln{display:flex;align-items:baseline;font-weight:800;font-size:54px;line-height:66px;white-space:nowrap}
.t{color:var(--amber);width:172px;flex:none;font-variant-numeric:tabular-nums}
.d{color:var(--amber);width:64px;flex:none}
.n{text-transform:uppercase;letter-spacing:.5px}
#top{left:40px;top:130px;width:2890px;height:110px;justify-content:center;border-left-width:2px;border-left-color:var(--edge)}
#top .ln{align-items:center}
#top .pill{height:84px;min-width:190px;margin-right:20px}
#top .t{width:auto;margin:0 24px 0 0}
#top .d{width:auto;margin-right:24px}
</style></head><body>

<script>
const DEFAULT={"morning":{"days":"ПН – ПТ","time":"8:00","title":"Утренняя молитва"},
"left":[{"d":"ПН","items":[["19:00","Встреча служителей"],["19:00","Библейский курс"]]},{"d":"ВТ","items":[["19:00","Домашние группы"],["19:00","Группа для зависимых"]]},{"d":"СР","items":[["19:00","Вечернее служение"]]}],
"right":[{"d":"ПТ","items":[["19:00","Молитвенное служение"],["19:00","Семинар для женщин"]]},{"d":"СБ","items":[["9:00","Братская молитва"]]},{"d":"ВС","items":[["11:00","Общее служение"],["18:00","Молодёжное служение"]]}]};
// ===================================
const st=document.getElementById('stage');
const tm=s=>s.replace(':',' ');
function line(t,n){return `<div class="ln"><span class="t">${tm(t)}</span><span class="d">–</span><span class="n">${n}</span></div>`}
function card(x,y,w,h,pill,body,id){const e=document.createElement('div');e.className='card';if(id)e.id=id;
  e.style.cssText+=`left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
  e.innerHTML=`<div class="pill">${pill}</div><div class="lines">${body}</div>`;st.appendChild(e)}
const ys=[262,484,706],H=198;let lastJson='';
function render(D){document.querySelectorAll('.card').forEach(e=>e.remove());
 const M=D.morning;card(40,130,2890,110,M.days,line(M.time,M.title),'top');
 D.left.forEach((r,i)=>card(40,ys[i],1540,H,r.d,r.items.map(a=>line(a[0],a[1])).join('')));
 D.right.forEach((r,i)=>card(1646,ys[i],1538,H,r.d,r.items.map(a=>line(a[0],a[1])).join('')));}
async function load(){try{const r=await fetch('schedule.json?_='+Date.now(),{cache:'no-store'});const txt=await r.text();
  if(txt!==lastJson){const D=JSON.parse(txt);render(D);lastJson=txt}}catch(e){if(!lastJson){render(DEFAULT);lastJson='default'}}}
load();setInterval(load,30000);
function fit(){const s=Math.min(innerWidth/3224,innerHeight/988);
  st.style.transform=`translate(${(innerWidth-3224*s)/2}px,${(innerHeight-988*s)/2}px) scale(${s})`}
addEventListener('resize',fit);fit();

// гирлянды и падающие листья
const cv=document.getElementById('cv'),g=cv.getContext('2d');
const COL=['#E8A23A','#D9772B','#C0392B','#E9C46A','#B5651D','#A23B1E','#F0B64A'];
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
